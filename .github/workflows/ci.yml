name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # Builds the image (the Dockerfile itself fails if ffmpeg lacks libass/libx264/aac)
  # and proves the app imports inside it. Nothing is pushed here.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: clipshorts:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import smoke test
        run: docker run --rm clipshorts:ci python -c "import clipshorts.main"

      - name: Healthcheck smoke test
        run: |
          docker run -d --name smoke clipshorts:ci
          for i in $(seq 1 30); do
            if docker exec smoke python -m clipshorts.healthcheck; then ok=1; break; fi
            sleep 2
          done
          docker rm -f smoke
          test "${ok:-0}" = 1

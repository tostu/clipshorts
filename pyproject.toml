[project]
name = "clipshorts"
version = "0.1.0"
description = "Twitch clip to vertical short: auto layout, burned-in subtitles, server-side pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # Twitch changes often: pinned, bump + rebuild deliberately.
    "yt-dlp==2026.10.26",
    "opencv-python-headless>=4.9",
    "faster-whisper>=1.0,<2",
    "av>=14,<17",  # av 19 breaks faster-whisper 1.2.1 (metadata_errors kwarg)
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<1",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipshorts"]

[tool.setuptools.package-data]
clipshorts = ["models/*.onnx", "fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
